<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E6 · 电子纸管理</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><div><span class="logo">E6</span><strong>电子纸管理</strong></div><span id="mode">未连接</span></header>
<main><section class="controls"><h1>准备下一幅画面</h1><p class="muted">GDEH037E01 · 480 × 720 · 六色</p>
<form id="prepare"><label for="file">上传图片</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">PNG / JPEG / WebP，最大 10 MiB、1600 万像素。</p>
<div class="row"><div><label for="algorithm">色彩处理</label><select id="algorithm"><option value="floyd-steinberg">照片 · 误差扩散抖动</option><option value="none">文字 / 图形 · 无抖动</option></select></div><div><label for="fit">画面适配</label><select id="fit"><option value="contain">完整保留 · 白边</option><option value="cover">填满屏幕 · 居中裁剪</option></select></div></div>
<button class="primary wide" type="submit">生成六色预览</button></form>
<div class="row"><button id="bars">预览六色色条</button><button id="white">预览全白</button></div>
<section class="device"><h2>设备状态</h2><dl><div><dt>当前阶段</dt><dd id="stage">未连接</dd></div><div><dt>下次可刷新</dt><dd id="wait">—</dd></div></dl><p id="device-error" role="status"></p></section>
</section><section class="display"><div class="preview-title"><h2>上屏预览</h2><span>4 bpp</span></div><div class="screen"><img id="preview" alt="六色处理后的待刷新画面" hidden><div id="empty"><strong>等待一幅新画面</strong><p>选择图片，或先用色条检查显示效果。</p></div></div><p class="hint">预览为近似 RGB 色彩；实际效果取决于面板、环境光和温度。</p>
<div class="submit"><label class="check"><input id="force" type="checkbox">重复画面也刷新（仍遵守间隔）</label><button class="primary" id="refresh" disabled>刷新电子纸</button></div><p id="message" role="status" aria-live="polite">选择图片或色条，生成预览。</p></section></main>
<footer>刷新完成后保留画面并进入深睡眠。连续刷新至少间隔 150 秒。</footer></body></html>
