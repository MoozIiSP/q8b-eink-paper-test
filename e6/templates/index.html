<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E6 · 电子纸管理</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><div><span class="logo">E6</span><strong>电子纸管理</strong></div><span id="mode">未连接</span></header>
<main><section class="controls"><h1>准备下一幅画面</h1><p class="muted">GDEH037E01 · 720 × 480 · 六色</p>
<form id="prepare"><label for="file">上传图片</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">PNG / JPEG / WebP，最大 10 MiB、1600 万像素。</p>
<div class="row"><div><label for="algorithm">色彩处理</label><select id="algorithm"><option value="floyd-steinberg">照片 · 误差扩散抖动</option><option value="atkinson">Atkinson · 蛇形误差扩散</option><option value="bayer">Bayer · 有序点阵</option><option value="none">文字 / 图形 · 无抖动</option></select></div><div><label for="fit">画面适配</label><select id="fit"><option value="contain">完整保留 · 白边</option><option value="cover">填满屏幕 · 居中裁剪</option></select></div></div>
<div class="row"><div><label for="orientation">显示方向</label><select id="orientation"><option value="landscape">横屏 · 720 × 480</option><option value="portrait">竖屏 · 480 × 720</option></select></div><div><label for="enhance">照片预处理</label><select id="enhance"><option value="photo">照片增强 · 色阶与锐化</option><option value="soft">柔化 · 降噪</option><option value="none">原图 · 不增强</option></select></div></div>
<details><summary>精细调节</summary><div class="adjustments">
<label>亮度 <input id="brightness" type="number" min="0.5" max="1.5" step="0.05" value="1"></label>
<label>对比度 <input id="contrast" type="number" min="0.5" max="1.5" step="0.05" value="1"></label>
<label>饱和度 <input id="saturation" type="number" min="0" max="2" step="0.05" value="1"></label>
<label>中间调 <input id="gamma" type="number" min="0.5" max="2" step="0.05" value="1"></label>
<label>抖动强度 <input id="strength" type="number" min="0" max="1" step="0.1" value="1" disabled></label>
</div><p class="hint">中间调大于 1 提亮暗部。抖动强度仅用于 Atkinson / Bayer。</p></details>
<button class="primary wide" type="submit">生成六色预览</button></form>
<button id="diagnostic" class="wide">预览定位测试图（无抖动）</button>
<div class="row"><button id="bars">预览六色色条</button><button id="white">预览全白</button></div>
<section class="device"><h2>设备状态</h2><dl><div><dt>当前阶段</dt><dd id="stage">未连接</dd></div><div><dt>下次可刷新</dt><dd id="wait">—</dd></div></dl><p id="device-error" role="status"></p></section>
</section><section class="display"><div class="preview-title"><h2>上屏预览</h2><span>4 bpp</span></div><div class="screen" id="screen"><img id="preview" alt="六色处理后的待刷新画面" hidden><div id="empty"><strong>等待一幅新画面</strong><p>选择图片，或先用色条检查显示效果。</p></div></div><p class="hint">预览为近似 RGB 色彩；实际效果取决于面板、环境光和温度。</p>
<div class="submit"><label class="check"><input id="force" type="checkbox">重复画面也刷新（仍遵守间隔）</label><button class="primary" id="refresh" disabled>刷新电子纸</button></div><p id="message" role="status" aria-live="polite">选择图片或色条，生成预览。</p></section></main>
<footer>刷新完成后保留画面并进入深睡眠。连续刷新至少间隔 150 秒。</footer></body></html>
